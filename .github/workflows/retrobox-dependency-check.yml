name: RetroBox iOS - Dependency Check
on:
  push:
    branches:
      - retrobox-lite
    paths:
      - '.github/workflows/retrobox-dependency-check.yml'
      - 'External/PackageBuildInfo/Sources/PackageBuildInfo/PackageBuildInfoGenerator.swift'
      - 'Provenance/Main UI/ProvenanceApp.swift'
  workflow_dispatch:

concurrency:
  group: retrobox-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-packages:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout exact branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
      - name: Initialize required submodules
        run: |
          ./Scripts/ci/ci-init-submodules.sh
          test -f Cores/4DO/Package.swift
      - name: Generate required libretro cheat database
        run: |
          bash PVLookup/Scripts/generate_cheatdb_if_needed.sh
          test -s PVLookup/Sources/LibretroCheatDB/Resources/libretro_cheats.sqlite.zip
      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: '26.3'
      - name: Show Xcode and package pins
        run: |
          xcodebuild -version
          for file in Provenance.xcworkspace/xcshareddata/swiftpm/Package.resolved Provenance.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved; do
            if [ -f "$file" ]; then
              echo "=== $file ==="
              grep -A 7 -E '"identity" : "(defaults|hexcolors|swift-syntax)"' "$file" || true
            fi
          done
      - name: Resolve packages only (no emulator compilation)
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -workspace Provenance.xcworkspace \
            -scheme "Provenance-Lite (AppStore)" \
            -skipPackagePluginValidation \
            -skipMacroValidation 2>&1 | tee /tmp/retrobox-package-resolution.log
      - name: Validate iOS Lite build for ARM64 simulator
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Provenance.xcworkspace \
            -scheme "Provenance-Lite (AppStore)" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/retrobox-simulator-build.log
      - name: Build iPhone app archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace Provenance.xcworkspace \
            -scheme "Provenance-Lite (AppStore)" \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RetroBox.xcarchive" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/retrobox-device-build.log
      - name: Package unsigned IPA for development signing
        run: |
          set -euo pipefail
          applications="$RUNNER_TEMP/RetroBox.xcarchive/Products/Applications"
          app_path="$(find "$applications" -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$app_path"
          mkdir -p "$RUNNER_TEMP/retrobox-package/Payload"
          ditto "$app_path" "$RUNNER_TEMP/retrobox-package/Payload/$(basename "$app_path")"
          cd "$RUNNER_TEMP/retrobox-package"
          ditto -c -k --keepParent Payload "$RUNNER_TEMP/RetroBox-iOS-UNSIGNED.ipa"
      - name: Upload unsigned iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: RetroBox-iOS-UNSIGNED-requires-signing
          path: ${{ runner.temp }}/RetroBox-iOS-UNSIGNED.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Upload iPhone build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrobox-device-build-log
          path: /tmp/retrobox-device-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload simulator build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrobox-simulator-build-log
          path: /tmp/retrobox-simulator-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload resolution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrobox-package-resolution-log
          path: /tmp/retrobox-package-resolution.log
          if-no-files-found: ignore
          retention-days: 7
