workflows:
  retrobox_i1_ios:
    name: RetroBox i1 - RetroArch iOS Simulator Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Check out tested RetroArch revision
        script: |
          set -e
          git clone https://github.com/libretro/RetroArch.git retroarch-ios
          git -C retroarch-ios checkout 9285db09dbfce3f9b22a8b0cfd765493b077dc7c
      - name: Build RetroArch iOS for simulator
        script: |
          set -o pipefail
          xcodebuild \
            -project retroarch-ios/pkg/apple/RetroArch_iOS11.xcodeproj \
            -scheme 'RetroArch iOS Debug' \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/retroarch-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee retroarch-ios-build.log
      - name: Collect simulator app
        script: |
          set -e
          find "$CM_BUILD_DIR/retroarch-derived-data/Build/Products" -name '*.app' -type d -print
          mkdir -p build-output
          find "$CM_BUILD_DIR/retroarch-derived-data/Build/Products" -name '*.app' -type d -exec cp -R '{}' build-output/ \;
    artifacts:
      - retroarch-ios-build.log
      - build-output/**
